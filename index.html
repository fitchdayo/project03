<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEST</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .gradient-background {
      background: #D4E7C3;
    }

    .bounce2 {
      animation: bounce2 2s ease infinite;
    }

    @keyframes bounce2 {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }

      40% {
        transform: translateY(-20px);
      }

      60% {
        transform: translateY(-10px);
      }
    }
  </style>
</head>

<body class="gradient-background">
  <div class="flex items-center justify-center h-screen">
    <div class="flex flex-col items-center p-4">
      <!-- Video element for .mp4 files -->
      <video id="videoDisplay" class="rounded-md h-[300px]" style="object-fit: cover; display: none;" autoplay muted loop></video>
      <!-- Image element for other content -->
      <img id="imageDisplay" src="" alt="" class="rounded-md h-[300px]" style="object-fit: cover;" />
      <h2 id="mainQuestion" class="text-4xl font-bold italic text-[#bd1e59] my-4"> So.. you have been sent here… right? </h2>
      <div class="flex gap-4 pt-[20px] items-center" id="responseButtons">
        <button id="nextButton"
          class="bounce2 inline-flex items-center justify-center whitespace-nowrap rounded-md text-[20px] font-medium disabled:pointer-events-none disabled:opacity-50 hover:bg-blue-400 min-h-12 min-w-[100px] px-4 py-2 bg-blue-500 text-white transition">
          Next
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    const nextButton = document.getElementById('nextButton');
    const imageDisplay = document.getElementById('imageDisplay');
    const videoDisplay = document.getElementById('videoDisplay');
    const mainQuestion = document.getElementById('mainQuestion');

    let clickCount = 0;

    const messages = [
      "Are you really S?",
      "Eh? Hontou? Hontou hontou??",
      "Ah I see.. Ok can u press next please :x",
      "Firstly, I'm sorry for this :x",
      "But I would like to say, I'm very thankful to have met you",
      "You have helped me a lot during my dark times with just your VA works.. :3",
      "Thank you for always making everyone feel safer with your work",
      "Lastly..",
      "I would like to tell you that..",
      "I like you.",
      "Would you be okay if I were to ask you out? :3",
      "You don't have to give me an answer now.",
      "Hehe"
    ];

    const contentPaths = [
      "", "", "", "", "", "", "", "",
      "./animation.gif.mp4", // Path for the 9th message
      "./animation.gif.mp4", // Path for the 10th message
      "./animation.gif.mp4", // Path for the 11th message
      "./animation.gif.mp4", // Path for the 12th message
      "./animation.gif.mp4"  // Path for the 13th message
    ];

    nextButton.addEventListener('click', function () {
      if (clickCount < messages.length) {
        const currentPath = contentPaths[clickCount];
        mainQuestion.textContent = messages[clickCount];

        if (currentPath.endsWith('.mp4')) {
          videoDisplay.src = currentPath;
          videoDisplay.style.display = 'block';
          imageDisplay.style.display = 'none';
        } else {
          imageDisplay.src = currentPath;
          imageDisplay.style.display = 'block';
          videoDisplay.style.display = 'none';
        }

        clickCount++;
      }

      if (clickCount === messages.length) {
        nextButton.style.display = 'none'; // Hide the button after the last message
      }
    });
  </script>
</body>

</html>
