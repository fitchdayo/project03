<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hehe2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .gradient-background {
      background: #D4E7C3;
    }

    .bounce2 {
      animation: bounce2 2s ease infinite;
    }

    @keyframes bounce2 {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-20px);
      }
      60% {
        transform: translateY(-10px);
      }
    }
  </style>
</head>

<body class="gradient-background">
  <div class="flex items-center justify-center h-screen">
    <div class="flex flex-col items-center p-4">
      <video id="videoDisplay" class="rounded-md h-[300px]" style="object-fit: cover; display: none;" autoplay muted loop></video>
      <img id="imageDisplay" src="" alt="" class="rounded-md h-[300px]" style="object-fit: cover;" />
      <div class="text-center">
        <h2 id="mainQuestion" class="text-4xl font-bold italic text-[#bd1e59] my-4">Benefits of having me</h2>
        <h2 id="firstQuestion" class="text-4xl font-bold italic text-[#bd1e59] my-4" style="opacity: 0;"></h2>
        <h2 id="secondQuestion" class="text-4xl font-bold italic text-[#bd1e59] my-4" style="opacity: 0;"></h2>
        <h2 id="thirdQuestion" class="text-4xl font-bold italic text-[#bd1e59] my-4" style="opacity: 0;"></h2>
      </div>
      <div class="flex gap-4 pt-[20px] items-center" id="responseButtons">
        <button id="nextButton"
          class="bounce2 inline-flex items-center justify-center whitespace-nowrap rounded-md text-[20px] font-medium disabled:pointer-events-none disabled:opacity-50 hover:bg-blue-400 min-h-12 min-w-[100px] px-4 py-2 bg-blue-500 text-white transition">
          Next
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    const nextButton = document.getElementById('nextButton');
    const imageDisplay = document.getElementById('imageDisplay');
    const videoDisplay = document.getElementById('videoDisplay');
    const mainQuestion = document.getElementById('mainQuestion');
    const firstQuestion = document.getElementById('firstQuestion');
    const secondQuestion = document.getElementById('secondQuestion');
    const thirdQuestion = document.getElementById('thirdQuestion');

    let clickCount = 0;

    const messages = [
      { first: "question 1?", second: "question 2??", third: "question 3??" },
      { first: "Ah I see.. Ok can u press next please :x", second: "Firstly, I'm sorry for this :x", third: "" },
      { first: "But I would like to say, I'm very thankful to have met you", second: "You have helped me a lot during my dark times with just your VA works.. :3", third: "" },
      { first: "Thank you for always making everyone feel safer with your work", second: "Lastly..", third: "" },
      { first: "I would like to tell you that..", second: "I like you.", third: "" },
      { first: "Would you be okay if I were to ask you out? :3", second: "You don't have to give me an answer now.", third: "" },
      { first: "Hehe", second: "", third: "" }
    ];

    const contentPaths = ["", "", "", "", "", "", "", "./animation.gif.mp4", "./animation.gif.mp4", "./animation.gif.mp4", "./animation.gif.mp4", "./animation.gif.mp4"];

    mainQuestion.style.opacity = 1;

    nextButton.addEventListener('click', function () {
      mainQuestion.style.opacity = 0;
      mainQuestion.style.transition = "opacity 1s";
      nextButton.disabled = true;

      if (clickCount < messages.length) {
        const { first, second, third } = messages[clickCount];
        const firstMessagePath = contentPaths[clickCount];
        clickCount++;

        firstQuestion.textContent = first;
        firstQuestion.style.opacity = 0;
        firstQuestion.style.transition = "opacity 1s";
        setTimeout(() => {
          firstQuestion.style.opacity = 1;
        }, 50);

        if (firstMessagePath.endsWith('.mp4')) {
          videoDisplay.src = firstMessagePath;
          videoDisplay.style.display = 'block';
          imageDisplay.style.display = 'none';
        } else {
          imageDisplay.src = firstMessagePath;
          imageDisplay.style.display = 'block';
          videoDisplay.style.display = 'none';
        }

        secondQuestion.style.opacity = 0;
        if (second) {
          setTimeout(() => {
            secondQuestion.textContent = second;
            secondQuestion.style.opacity = 0;
            secondQuestion.style.transition = "opacity 1s";
            setTimeout(() => {
              secondQuestion.style.opacity = 1;
            }, 50);
          }, 2000);
        }

        thirdQuestion.style.opacity = 0;
        if (third) {
          setTimeout(() => {
            thirdQuestion.textContent = third;
            thirdQuestion.style.opacity = 0;
            thirdQuestion.style.transition = "opacity 1s";
            setTimeout(() => {
              thirdQuestion.style.opacity = 1;
            }, 50);
          }, 4000);
        }
      }

      if (clickCount >= messages.length) {
        nextButton.style.display = 'none';
      }

      setTimeout(() => {
        nextButton.disabled = false;
      }, 2000);
    });
  </script>
</body>
</html>
