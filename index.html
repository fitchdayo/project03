<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEST</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .gradient-background {
      background: #D4E7C3;
    }

    .bounce2 {
      animation: bounce2 2s ease infinite;
    }

    @keyframes bounce2 {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }

      40% {
        transform: translateY(-20px);
      }

      60% {
        transform: translateY(-10px);
      }
    }
  </style>
</head>

<body class="gradient-background">
  <div class="flex items-center justify-center h-screen">
    <div class="flex flex-col items-center p-4">
      <video id="videoDisplay" class="rounded-md h-[300px]" style="object-fit: cover; display: none;" autoplay muted loop></video>
      <img id="imageDisplay" src="" alt="" class="rounded-md h-[300px]" style="object-fit: cover;" />
      <div class="text-center">
        <h2 id="firstQuestion" class="text-4xl font-bold italic text-[#bd1e59] my-4" style="opacity: 0;"></h2>
        <h2 id="secondQuestion" class="text-4xl font-bold italic text-[#bd1e59] my-4" style="opacity: 0;"></h2>
        <h2 id="mainQuestion" class="text-4xl font-bold italic text-[#bd1e59] my-4" style="opacity: 0;"></h2> <!-- Main Question -->
      </div>
      <div class="flex gap-4 pt-[20px] items-center" id="responseButtons">
        <button id="nextButton"
          class="bounce2 inline-flex items-center justify-center whitespace-nowrap rounded-md text-[20px] font-medium disabled:pointer-events-none disabled:opacity-50 hover:bg-blue-400 min-h-12 min-w-[100px] px-4 py-2 bg-blue-500 text-white transition">
          Next
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    const nextButton = document.getElementById('nextButton');
    const imageDisplay = document.getElementById('imageDisplay');
    const videoDisplay = document.getElementById('videoDisplay');
    const firstQuestion = document.getElementById('firstQuestion');
    const secondQuestion = document.getElementById('secondQuestion');
    const mainQuestion = document.getElementById('mainQuestion'); // Main question element

    let clickCount = 0;

    // The messages array with pairs of first and second questions
    const messages = [
      { first: "Are you really S?", second: "Eh? Hontou? Hontou hontou??" },
      { first: "Ah I see.. Ok can u press next please :x", second: "Firstly, I'm sorry for this :x" },
      { first: "But I would like to say, I'm very thankful to have met you", second: "You have helped me a lot during my dark times with just your VA works.. :3" },
      { first: "Thank you for always making everyone feel safer with your work", second: "Lastly.." },
      { first: "I would like to tell you that..", second: "I like you." },
      { first: "Would you be okay if I were to ask you out? :3", second: "You don't have to give me an answer now." },
      { first: "Hehe", second: "" } // Last message only has one part
    ];

    // The content paths (image or video paths) for each message pair
    const contentPaths = [
      "", "", "", "", "", "", "", 
      "./animation.gif.mp4", // Path for the 9th message
      "./animation.gif.mp4", // Path for the 10th message
      "./animation.gif.mp4", // Path for the 11th message
      "./animation.gif.mp4", // Path for the 12th message
      "./animation.gif.mp4"  // Path for the 13th message
    ];

    // Set initial main question to be shown immediately
    mainQuestion.textContent = "Test test";
    mainQuestion.style.opacity = 0;
    mainQuestion.style.transition = "opacity 1s";
    setTimeout(() => {
      mainQuestion.style.opacity = 1;
    }, 50); // Display main question with fade-in effect

    nextButton.addEventListener('click', function () {
      if (clickCount < messages.length) {
        const { first, second } = messages[clickCount]; // Destructure the current pair of messages
        const firstMessagePath = contentPaths[clickCount]; // Path for the first message
        clickCount++;

        // Display the first message immediately (no delay)
        firstQuestion.textContent = first;
        firstQuestion.style.opacity = 0;
        firstQuestion.style.transition = "opacity 1s";
        setTimeout(() => {
          firstQuestion.style.opacity = 1;
        }, 50); // Delay slightly to trigger the transition

        // Display the first message's image or video
        if (firstMessagePath.endsWith('.mp4')) {
          videoDisplay.src = firstMessagePath;
          videoDisplay.style.display = 'block';
          imageDisplay.style.display = 'none';
        } else {
          imageDisplay.src = firstMessagePath;
          imageDisplay.style.display = 'block';
          videoDisplay.style.display = 'none';
        }

        // Display the second message after a delay (2 seconds)
        if (second) {
          setTimeout(() => {
            secondQuestion.textContent = second;
            secondQuestion.style.opacity = 0;
            secondQuestion.style.transition = "opacity 1s";
            setTimeout(() => {
              secondQuestion.style.opacity = 1;
            }, 50);

            // Display the second message's image or video
            const secondMessagePath = contentPaths[clickCount];
            if (secondMessagePath.endsWith('.mp4')) {
              videoDisplay.src = secondMessagePath;
              videoDisplay.style.display = 'block';
              imageDisplay.style.display = 'none';
            } else {
              imageDisplay.src = secondMessagePath;
              imageDisplay.style.display = 'block';
              videoDisplay.style.display = 'none';
            }
          }, 2000); // 2-second pause before showing the second message
        }
      }

      if (clickCount >= messages.length) {
        nextButton.style.display = 'none'; // Hide the button after the last message
      }
    });
  </script>
</body>

</html>
